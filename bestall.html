<!DOCTYPE html>
<html lang="sv">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Beställ din favoritpizza från Pomodoro Pizzeria.">
	<meta name="author" content="Hanna Vigren">
	<meta name="keywords" content="beställ pizza, online beställning, hemkörning">
	<title>Beställ - Pomodoro Pizzeria</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<header>
		<nav>
			<ul>
				<li><a href="index.html"><img src="logo.png" alt="Pomodoro Pizzeria" class="logo"></a></li>
				<li><a href="index.html" onmouseover="highlightNav(this)" onmouseout="unhighlightNav(this)">Hem</a></li>
				<li><a href="meny.html" onmouseover="highlightNav(this)" onmouseout="unhighlightNav(this)">Meny</a></li>
				<li><a href="omoss.html" onmouseover="highlightNav(this)" onmouseout="unhighlightNav(this)">Om oss</a></li>
				<li><a href="bestall.html" onmouseover="highlightNav(this)" onmouseout="unhighlightNav(this)">Beställ</a></li>
				<li><a href="recensioner.html" onmouseover="highlightNav(this)" onmouseout="unhighlightNav(this)">Recensioner</a></li>
			</ul>
		</nav>
	</header>
	<main>
		<h1>Beställ</h1>
		<form action="mailto:bestallning@pomodoro.se" method="post" enctype="text/plain">
			<label for="namn">Namn:</label>
			<input type="text" id="namn" name="namn" onfocus="focusInput(this)" onblur="blurInput(this)" required>
			<label for="telefon">Telefon:</label>
			<input type="tel" id="telefon" name="telefon" onfocus="focusInput(this)" onblur="blurInput(this)" required>
			<label for="adress">Adress:</label>
			<input type="text" id="adress" name="adress" onfocus="focusInput(this)" onblur="blurInput(this)" required>
			<label for="bestallning">Din beställning:</label>
			<textarea id="bestallning" name="bestallning" onfocus="focusInput(this)" onblur="blurInput(this)" required></textarea>
			<button type="submit">Skicka</button>
		</form>
	</main>
	<footer>
		<p>&copy; 2026 Pomodoro Pizzeria</p>
	</footer>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
